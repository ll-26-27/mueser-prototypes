title: Research places
description: Records in the shared schema, resolved against historical gazetteers. The `places` view carries latitude/longitude for the cluster map; `candidates` holds every gazetteer answer behind each decision.
plugins:
  datasette-cluster-map:
    latitude_column: latitude
    longitude_column: longitude
databases:
  research:
    tables:
      records:
        sort: year_start
        facets: [type, resolution_status, resolution_source, source_doc_id]
      candidates:
        sort: name
        facets: [status, source]
