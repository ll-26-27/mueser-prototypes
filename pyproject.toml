[project]
name = "mueser"
version = "0.1.0"
description = "Faculty research prototypes: German Fraktur/Kurrent transcription and historical place-name mapping"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "pillow>=10.3",
  "rich>=13.7",
]

[project.optional-dependencies]
text = [
  "pytesseract>=0.3.13",
  "jiwer>=3.0",
  "lxml>=5.2",
  "numpy>=1.26",
]
maps = [
  "duckdb>=1.0",
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "openpyxl>=3.1",
  "datasette>=0.65",
  "datasette-cluster-map>=0.18",
  "sqlite-utils>=3.36",
]
htr = [
  "kraken>=5.2",
]
ner = [
  "flair>=0.14",
]
gpu = [
  "transformers>=4.44",
  "torch>=2.3",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mueser"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
